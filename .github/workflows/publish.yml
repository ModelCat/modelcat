name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v1.2.3)'
        required: true
        type: string

# REQUIRED for Trusted Publishers (OIDC token generation)
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish Python distribution
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}
        fetch-depth: 0 # setuptools-scm needs the full history and tags to determine the version

    - name: Check tag exists
      run: |
        TAG="${{ inputs.tag || github.ref_name }}"
        if ! git tag --list | grep -qx "$TAG"; then
          echo "Error: tag '$TAG' does not exist in this repository."
          exit 1
        fi
        echo "Tag '$TAG' found."

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine

    - name: Build package
      run: python -m build

    - name: Verify package
      run: python -m twine check dist/*

    - name: Publish to PyPI
      # Safety check: Only upload to PyPI if triggered on a release tag (v*) or if a valid tag was specified in manual input
      if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')
      uses: pypa/gh-action-pypi-publish@release/v1
      # Note: No 'with: password' needed for OIDC